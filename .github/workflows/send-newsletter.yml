name: Send Newsletter
on:
  schedule:
    # UTC 22:05 = Beijing 06:05 — 5 minutes after daily collection
    - cron: '5 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to send (YYYY-MM-DD, defaults to today)'
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send newsletter
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          PAYLOAD='{}'
          if [ -n "$DATE" ]; then
            PAYLOAD="{\"date\":\"$DATE\"}"
          fi
          curl -s -X POST "${{ vars.SEND_NEWSLETTER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
