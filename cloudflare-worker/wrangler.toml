name = "social-hotspot-subscribe"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Route: api.hotspot.edgesoft.org/* → this Worker
routes = [
  { pattern = "api.hotspot.edgesoft.org/*", zone_id = "52278002c242bfc6de2d3360f20a8c77" }
]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "social-hotspot-subscribe-db"
database_id = "c1711a3c-ba14-4a04-b961-1c4c1cedba36"

# Secrets (set via `wrangler secret put` or Cloudflare Dashboard):
# RESEND_API_KEY     — your Resend.com API key

[observability]
logs = { enabled = true, invocation_logs = true }

[vars]
BLOG_BASE_URL = "https://hotspot.edgesoft.org"
FROM_EMAIL = "newsletter@edgesoft.org"
