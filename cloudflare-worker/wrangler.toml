name = "social-hotspot-subscribe"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Route: hotspot.edgesoft.org/api/* → this Worker
# CLOUDFLARE_ZONE_ID from environment
routes = [
  { pattern = "${CLOUDFLARE_ROUTE}", zone_id = "${CLOUDFLARE_ZONE_ID}" }
]

# D1 Database Binding
# CLOUDFLARE_DATABASE_ID from environment
[[d1_databases]]
binding = "DB"
database_name = "social-hotspot-subscribe-db"
database_id = "${CLOUDFLARE_DATABASE_ID}"

# Secrets (set via `wrangler secret put` or Cloudflare Dashboard):
# RESEND_API_KEY     — your Resend.com API key

[observability]
logs = { enabled = true, invocation_logs = true }

[vars]
BLOG_BASE_URL = "${BLOG_BASE_URL}"
FROM_EMAIL = "${NEWSLETTER_FROM_EMAIL}"
