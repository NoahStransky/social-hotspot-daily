# Social Hotspot Daily - Configuration
# 复制为 config.yaml 并填入你的 API keys
# 也可以在 .env 文件中设置环境变量，config.yaml 会自动读取

# =============================================================================
# LLM Provider (DeepSeek) - 用于 AI 分类和摘要
# =============================================================================
deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  model: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"

# =============================================================================
# Data Sources - 开关和配置
# =============================================================================
sources:
  twitter:
    enabled: true
    bearer_token: "${TWITTER_BEARER_TOKEN}"
    max_results: 20
    target_accounts:
      - "ylecun"
      - "karpathy"
      - "sama"
      - "elonmusk"
    
  reddit:
    enabled: true
    client_id: "${REDDIT_CLIENT_ID}"
    client_secret: "${REDDIT_CLIENT_SECRET}"
    user_agent: "SocialHotspotBot/1.0"
    subreddits:
      - "technology"
      - "artificial"
      - "MachineLearning"
      - "programming"
    limit: 15
    
  hackernews:
    enabled: true
    top_stories_limit: 20
    
  youtube:
    enabled: true
    api_key: "${YOUTUBE_API_KEY}"
    region_code: "US"
    category_id: "28"  # Science & Technology
    max_results: 10
    
  weibo:
    enabled: true
    # 微博热搜不需要 API key，直接爬取
    
  zhihu:
    enabled: true
    # 知乎热榜不需要 API key，直接爬取
    
  rss:
    enabled: true
    feeds:
      - "https://techcrunch.com/feed/"
      - "https://www.theverge.com/rss/index.xml"
      - "https://feeds.arstechnica.com/arstechnica/technology"
      - "https://rsshub.app/36kr/information/technology"
      - "https://rsshub.app/ithome/it"

# =============================================================================
# AI Filtering - 只保留 IT/AI/Tech 相关内容
# =============================================================================
ai_filter:
  enabled: true
  categories: ["artificial_intelligence", "technology", "programming", "science", "startup", "cybersecurity"]
  min_confidence: 0.6
  max_items_per_source: 10

# =============================================================================
# Output Settings
# =============================================================================
output:
  blog:
    title: "${BLOG_TITLE:-Tech Hotspot Daily}"
    description: "${BLOG_DESCRIPTION:-每日全球科技热点聚合}"
    author: "${BLOG_AUTHOR:-Social Hotspot Bot}"
    base_url: "${BLOG_BASE_URL}"
    
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    
  local:
    enabled: false
    path: "./output"

# =============================================================================
# Analytics & Ads Configuration
# =============================================================================
analytics:
  google_analytics_id: "${GA_MEASUREMENT_ID}"
  google_adsense_id: "${ADSENSE_CLIENT_ID}"
