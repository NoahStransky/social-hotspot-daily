<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Subscription — Tech Hotspot Daily</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-2: #1a1a25;
            --border: #252535;
            --text: #e2e2f0;
            --text-secondary: #8b8ba7;
            --accent: #6366f1;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .status-icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        p { color: var(--text-secondary); font-size: 15px; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #5558e0; transform: translateY(-1px); }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-icon" id="icon">⏳</div>
        <h1 id="title">Verifying...</h1>
        <p id="message">Please wait while we process your request.</p>
        <a href="index.html" class="back-link" id="backLink">← Back to Daily Report</a>
    </div>

    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const token = params.get('token');

        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const backLink = document.getElementById('backLink');

        const STATUS_MAP = {
          success: {
            icon: '✅',
            title: 'Subscription Verified!',
            message: 'Thank you! Your email has been verified successfully.<br><br>You will now receive <strong>Tech Hotspot Daily</strong> in your inbox every morning.<br><br>First email coming soon!'
          },
          already: {
            icon: '👍',
            title: 'Already Verified',
            message: 'This email address has already been verified.<br><br>You\'re all set to receive daily tech news!'
          },
          invalid: {
            icon: '❌',
            title: 'Invalid Link',
            message: 'This verification link is invalid or has expired.<br><br>Please try subscribing again to receive a new verification email.'
          },
          error: {
            icon: '⚠️',
            title: 'Verification Error',
            message: 'Something went wrong while verifying your email.<br><br>Please try again or <a href="subscribe.html" style="color: var(--accent);">subscribe again</a>.'
          },
        };

        // If Worker redirected with ?status=, show that
        if (status && STATUS_MAP[status]) {
          const s = STATUS_MAP[status];
          icon.textContent = s.icon;
          title.textContent = s.title;
          message.innerHTML = s.message;

          if (status === 'success' || status === 'already') {
            backLink.textContent = '← Go to Today\'s Report';
            backLink.href = 'index.html';
          } else {
            backLink.textContent = '← Try subscribing again';
            backLink.href = 'subscribe.html';
          }
        } else if (token) {
          // Direct access with token — show loading, could optionally call Worker
          // but the Worker already handles this via redirect; this is a fallback
          icon.textContent = '⏳';
          title.textContent = 'Verifying...';
          message.innerHTML = 'You should be redirected automatically. If not, click the link below.';
        } else {
          // No parameters — show generic info
          icon.textContent = '📧';
          title.textContent = 'Verify Your Subscription';
          message.innerHTML = 'This page is used to verify email subscriptions for Tech Hotspot Daily.<br><br>If you were directed here from a verification email, that link may be invalid.';
        }
      })();
    </script>
</body>
</html>
